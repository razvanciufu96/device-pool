services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Demo reservations ("tomorrow 13:00") are created in this time zone.
      TZ: ${TZ:-Europe/Bucharest}
    volumes:
      - h2-data:/app/data
    healthcheck:
      # The JRE image has no curl/wget, so use bash's /dev/tcp for a plain HTTP request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /api/users HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        # Don't serve the app until the API answers, so the first page load never sees a 502.
        condition: service_healthy

volumes:
  h2-data:
