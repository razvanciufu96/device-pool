server {
    listen 80;
    root /usr/share/nginx/html;

    # Same role as the Vite dev proxy: the browser only talks to this origin.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths (/devices, /my, ...) are handled by Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
