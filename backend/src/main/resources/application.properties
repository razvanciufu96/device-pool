spring.application.name=device-pool

# File-based H2 so data survives restarts; lives in backend/data/ (git-ignored).
spring.datasource.url=jdbc:h2:file:./data/devicepool;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway migrations; Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Insert a few demo reservations relative to "now" on first start.
app.demo-data=true
